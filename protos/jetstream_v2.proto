syntax = "proto3";

package jetstream.v2;

import "google/protobuf/timestamp.proto";

service JetstreamV2 {
  rpc SubscribeTransactions(stream SubscribeTransactionsRequest) returns (stream SubscribeTransactionsResponse) {}

  // Server-streaming slot lifecycle events.
  rpc SubscribeSlots(SubscribeSlotsRequest) returns (stream SlotEvent) {}

  // Unary health/version probes.
  rpc Ping(PingRequest) returns (PongResponse) {}
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse) {}
}

// ============= Request =============

message SubscribeTransactionsRequest {
  oneof payload {
    Ping          ping           = 1;
    AddFilters    add_filters    = 2;
    RemoveFilters remove_filters = 3;
  }
}

message Ping {
  int32 ping_id = 1;
}

message AddFilters {
  repeated TxFilter filters = 1;
}

message TxFilter {
  string                             filter_id = 1;  // client-provided, max 127 chars
  SubscribeRequestFilterTransactions filter    = 2;
}

message SubscribeRequestFilterTransactions {
  repeated string account_include  = 1;
  repeated string account_exclude  = 2;
  repeated string account_required = 3;

  // Opt-in enrichment. Default false = lean response (core fields only). Set
  // true to also receive fee_payer / writable_accounts / program_ids /
  // compute_unit_price / compute_limit / tx_size. Applies to the whole
  // subscription: if any of your active filters sets this true, every
  // transaction you receive is enriched.
  bool include_enrichment = 4;
}

message RemoveFilters {
  repeated string filter_ids = 1;
}

// ============= Response =============

message SubscribeTransactionsResponse {
  google.protobuf.Timestamp created_at = 1;

  oneof payload {
    FilteredTransaction transaction       = 2;
    Pong                pong              = 3;
    FilterResult        filter_validation = 5;
    Heartbeat           heartbeat         = 6;
  }

  uint64 sequence = 4;
}

message Pong {
  int32 ping_id = 1;
}

message FilterResult {
  string filter_id        = 1;
  bool   accepted         = 2;
  string rejection_reason = 3;  // empty string when accepted=true (proto3 default elision)
}

message Heartbeat {
  // Server wall-clock at emit time, milliseconds since Unix epoch. Lets
  // clients measure one-way skew / network delay and age out stale
  // connections.
  uint64 server_ts_ms = 1;
}

message FilteredTransaction {
  repeated string    filter_ids  = 1;
  TransactionMessage transaction = 2;
}

// TransactionMessage - a flat transaction representation (all fields inline).
//
// Fields 1-13 are the core transaction and are always present (the default
// "lean" output). Fields 14-22 and 24 are optional enrichment, emitted only
// when the session opts in via
// SubscribeRequestFilterTransactions.include_enrichment.
//
// Field 23 (config) is NOT enrichment-gated: it is intrinsic transaction data
// and is always sent when the transaction is V1.
//
// Fields 23-24 were added for SIMD-0385 Transaction V1. They are additive:
// a client built against the previous version of this file skips them as
// unknown fields and continues to decode every other field normally. No
// action is required to keep working, and there is no opt-in flag.
message TransactionMessage {
  // Identity / placement
  uint64 slot      = 1;
  bytes  signature = 2;  // primary signature (signatures[0])
  uint32 tx_index  = 3;  // position of this tx within its entry

  // Full signature set (repeated bytes)
  repeated bytes signatures = 4;

  // Vote flag
  bool is_vote = 5;

  // Message header
  uint32 num_required_signatures        = 6;
  uint32 num_readonly_signed_accounts   = 7;
  uint32 num_readonly_unsigned_accounts = 8;

  // Recent blockhash
  bytes recent_blockhash = 9;

  // Versioned-transaction flag.
  bool versioned = 10;

  // Core body contents
  repeated bytes                     account_keys          = 11;
  repeated CompiledInstruction       instructions          = 12;
  repeated MessageAddressTableLookup address_table_lookups = 13;

  // Enrichment — emitted only when the session opts in via
  // SubscribeRequestFilterTransactions.include_enrichment.
  bytes          fee_payer         = 14;
  repeated bytes writable_accounts = 15;
  repeated bytes program_ids       = 16;
  uint64         compute_unit_price = 17;  // compute-unit price, micro-lamports per CU (from SetComputeUnitPrice); 0 if unset. NOT the total priority fee.
  uint32         compute_limit     = 18;
  uint32         tx_size           = 19;

  // Resolved addresses from a versioned tx's address_table_lookups. Emitted
  // only when enrichment is opted in (same gate as fields 14-19). Empty for a
  // legacy (non-versioned) tx; when a lookup can't be fully resolved,
  // alt_resolution_incomplete (field 22) is set and any addresses that did
  // resolve are still included.
  repeated bytes loaded_writable_addresses = 20;
  repeated bytes loaded_readonly_addresses = 21;

  // Set true when one or more of this transaction's address_table_lookups could
  // NOT be fully resolved, so the loaded_writable_addresses /
  // loaded_readonly_addresses above are INCOMPLETE. When true, resolve the tx's
  // accounts yourself from address_table_lookups (fetch the tables via
  // getMultipleAccounts). Default false = fully resolved. Emitted only under
  // enrichment (same gate as fields 14-21).
  bool alt_resolution_incomplete = 22;

  // ---- SIMD-0385 Transaction V1 ----

  // Transaction config, carried in the message body by V1 transactions.
  //
  // PRESENT ONLY FOR V1. Absent for legacy and V0. The presence of this field
  // is how you identify a V1 transaction -- see the version table below.
  //
  // Always sent (not enrichment-gated), because it is intrinsic transaction
  // data rather than something we derive.
  //
  //   version | versioned (fn 10) | config (fn 23)
  //   --------|-------------------|----------------
  //   legacy  | false             | absent
  //   v0      | true              | absent
  //   v1      | true              | PRESENT
  //
  // Test config first: `versioned` is true for both v0 and v1.
  TransactionConfig config = 23;

  // Priority fee in TOTAL LAMPORTS, populated for ALL THREE versions so they
  // can be ranked against one another.
  //
  // Use this, not compute_unit_price (fn 17), to order transactions by fee.
  // Field 17 is micro-lamports per compute unit read from a
  // SetComputeUnitPrice instruction; V1 has no such instruction, so field 17
  // is ABSENT for every V1 transaction and sorting on it alone ranks all V1
  // traffic last.
  //
  //   v1          : config.priority_fee verbatim
  //   legacy / v0 : derived from the ComputeBudget instructions --
  //                   limit = compute_unit_limit, or if unset
  //                           min(200000 * num_instructions, 1400000)
  //                   fee   = ceil(limit * compute_unit_price / 1000000)
  //
  // Emitted only when the session opts into enrichment.
  uint64 priority_fee_lamports = 24;
}

// Transaction-level configuration carried by V1 messages (SIMD-0385).
//
// V1 replaces the ComputeBudget instructions used by legacy and V0 with four
// values encoded directly in the message.
//
// A value of 0 means "not requested" for every field here, so you can read
// the values directly without checking presence. config_mask records what
// the sender literally set, if you need that.
//
// ComputeBudget instructions inside a V1 transaction are ignored by the
// runtime even when present, so do not read configuration out of them for a
// transaction that carries this message.
message TransactionConfig {
  // Priority fee in TOTAL LAMPORTS. This is not a per-compute-unit price.
  // 0 means no priority fee was requested.
  uint64 priority_fee = 1;

  // Requested compute unit limit. 0 means 0 was requested, which SIMD-0385
  // also makes the default when the field is not set -- the two are the same.
  uint32 compute_unit_limit = 2;

  // Requested loaded accounts data size limit, in bytes. 0 means 0, which
  // SIMD-0385 treats identically to unset (both reserve one 32 KiB page for
  // cost-model purposes). Note this differs from legacy/V0, where the default
  // is 64 MiB.
  uint32 loaded_accounts_data_size_limit = 3;

  // Requested heap size in bytes. When set it is always a multiple of 1024 in
  // the inclusive range [32768, 262144], so 0 unambiguously means "not
  // requested" and the 32 KiB default applies.
  uint32 heap_size = 4;

  // The raw SIMD-0385 TransactionConfigMask, exactly as it appeared in the
  // transaction. This is the authoritative record of which values the sender
  // actually requested:
  //
  //   bits 0-1  priority fee        (both bits set together, or neither)
  //   bit  2    compute unit limit
  //   bit  3    loaded accounts data size limit
  //   bit  4    heap size
  //
  // You do not need this for normal use: for every field above, a value of 0
  // and "not requested" mean the same thing, so you can read the values
  // directly. It is here for callers that want to reproduce the sender's
  // exact intent, and it is 0 when the sender requested nothing at all.
  uint32 config_mask = 5;
}

message CompiledInstruction {
  uint32 program_id_index = 1;
  bytes  accounts         = 2;
  bytes  data             = 3;
}

message MessageAddressTableLookup {
  bytes account_key      = 1;
  bytes writable_indexes = 2;
  bytes readonly_indexes = 3;
}

// ============= SubscribeSlots =============

message SubscribeSlotsRequest {
  // Opt in to SLOT_STATUS_BLOCK_FOOTER events (Alpenglow block footers).
  // Off by default: a client that leaves it unset gets exactly the events it
  // got before this field existed.
  bool include_block_footer = 1;
}

enum SlotStatus {
  SLOT_STATUS_UNSPECIFIED  = 0;
  SLOT_STATUS_ALIVE        = 1;  // first shred of this slot received
  SLOT_STATUS_COMPLETE     = 2;  // last shred of this slot received
  SLOT_STATUS_DEAD         = 3;  // slot skipped, or superseded by later slots without completing
  // The slot's block footer; SlotEvent.block_footer is set. Sent only to
  // streams that set include_block_footer, at most once per slot. It usually
  // arrives right around COMPLETE, before or after it (the two are not
  // ordered), and can also follow DEAD or arrive for a slot that never gets
  // COMPLETE. It does not change the slot's status and is not a terminal
  // event. A slot without a footer gets no such event.
  SLOT_STATUS_BLOCK_FOOTER = 4;
}

message SlotEvent {
  uint64     slot           = 1;
  SlotStatus status         = 2;
  // 32-byte pubkey. Empty bytes (proto3 default) means the current leader is
  // unavailable.
  bytes      current_leader = 3;
  // Parent slot, from the first shred received for this slot. 0 means
  // "unknown parent" (e.g. a DEAD event for a slot that was never observed).
  uint64     parent_slot    = 4;
  uint64     sequence       = 5;  // monotonic per-stream
  // Set only when status == SLOT_STATUS_BLOCK_FOOTER.
  BlockFooter block_footer  = 6;
}

// Alpenglow block footer, delivered before the block has been executed.
// The BLS signatures in the certificates are not checked: treat the
// contents as the slot leader's claims, not as proof of finality.
message BlockFooter {
  uint64 slot = 1;
  reserved 2;
  bytes  bank_hash = 3;                 // 32 bytes
  uint64 block_producer_time_nanos = 4;
  bytes  block_user_agent = 5;          // 0-255 bytes, raw
  reserved 6, 7, 8;

  BlockFooterFinalCert       block_final_cert  = 9;
  BlockFooterSkipRewardCert  skip_reward_cert  = 10;
  BlockFooterNotarRewardCert notar_reward_cert = 11;

  // 32 bytes: the Alpenglow block id, the same value validators vote on and
  // certify, and that the next block names as its parent. Like the rest of
  // the footer it is not verified against a signature. Empty when it could
  // not be determined for this slot.
  bytes block_id = 100;
}

enum BlockFooterSignatureKind {
  COMPRESSED_BLS12_381_G2 = 0;
}

message BlockFooterVotesAggregate {
  BlockFooterSignatureKind signature_kind = 1;
  bytes signature     = 2;              // 96 bytes
  bytes block_id      = 3;              // 32 bytes when the cert names a block, else empty
  bytes signer_bitmap = 4;
}

message BlockFooterFinalCert {
  uint64 slot = 1;
  BlockFooterVotesAggregate final_aggregate = 2;
  BlockFooterVotesAggregate notar_aggregate = 3;
}

message BlockFooterSkipRewardCert {
  uint64 slot = 1;
  BlockFooterVotesAggregate aggregate = 2;
}

message BlockFooterNotarRewardCert {
  uint64 slot = 1;
  BlockFooterVotesAggregate aggregate = 2;
}

// ============= Unary RPC messages =============

message PingRequest {
  int32 count = 1;
}

message PongResponse {
  int32 count = 1;
}

message GetVersionRequest {}

message GetVersionResponse {
  string version = 1;
}
